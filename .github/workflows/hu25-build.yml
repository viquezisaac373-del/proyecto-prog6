name: HU25 - Compilacion MVC y CoreWCF

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restaurar aplicacion MVC
        run: dotnet restore ProyectoHospital/ProyectoHospital/ProyectoHospital.csproj
      - name: Compilar aplicacion MVC
        run: dotnet build ProyectoHospital/ProyectoHospital/ProyectoHospital.csproj --no-restore -c Release
      - name: Restaurar servicio CoreWCF
        run: dotnet restore ProyectoHospital/Hospinomenal.WcfService/Hospinomenal.WcfService.csproj
      - name: Compilar servicio CoreWCF
        run: dotnet build ProyectoHospital/Hospinomenal.WcfService/Hospinomenal.WcfService.csproj --no-restore -c Release

      - name: Comprobar publicacion del WSDL CoreWCF (sin consultar BD)
        env:
          ConnectionStrings__HospitalDB: "Server=127.0.0.1;Database=Hospital_DB4_Integracion;Integrated Security=True;Encrypt=True;TrustServerCertificate=True"
        run: |
          dotnet run --project ProyectoHospital/Hospinomenal.WcfService/Hospinomenal.WcfService.csproj --no-build -c Release > /tmp/wcf-hu25.log 2>&1 &
          WCF_PID=$!
          trap 'kill $WCF_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:5108/HorariosMedicos.svc?wsdl" -o /tmp/horarios.wsdl; then
              grep -q "ConsultarHorarios" /tmp/horarios.wsdl
              echo "WSDL publicado con la operacion ConsultarHorarios."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wcf-hu25.log
          exit 1
